services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  app:
    build: .
    depends_on:
      - ollama
    env_file:
      - .env                                   # your provider/keys (gitignored, not baked into the image)
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434    # overrides .env to reach the sidecar
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./outputs:/app/outputs

  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "3000:80"                              # open the full UI at http://localhost:3000

volumes:
  ollama_models:
