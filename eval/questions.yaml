# Retrieval eval set (spec §6.4): question -> expected source passage pairs.
#
# A retrieval is counted correct for a question if a retrieved chunk satisfies ANY one of
# its `expected` specs. A spec matches when:
#   - `file` (if given) equals the chunk's source file_name, AND
#   - `page` (if given) equals the chunk's page_number, AND
#   - `must_contain` (if given) appears (case-insensitive) in the chunk text.
# `must_contain` is the primary signal (it proves the answer-bearing passage was found);
# `page` is only asserted where the fact sits on one unambiguous page.
#
# 18 questions covering both bids across: bid number, due date (incl. addendum override),
# pre-bid meeting, term, cooperative, contact, company, manufacturer, delivery, affidavits,
# warranty, model numbers, submission method and invoicing.

# ---------------------------------------------------------------- Bid1
- id: q01
  question: "What is the submission deadline for Bid1 after all addendums?"
  bid_id: Bid1
  expected:
    - file: "Addendum_2_RFP_JA-207652_Student_and_Staff_Computing_Devices.pdf"
      page: 1
      must_contain: "July 9, 2024"

- id: q02
  question: "What is the official solicitation / bid number for the Dallas computing devices RFP?"
