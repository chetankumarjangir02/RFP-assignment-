server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large bid-folder uploads through to the API.
    client_max_body_size 64M;

    # SPA: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend, stripping the /api prefix
    # (mirrors the Vite dev proxy, so no frontend code changes between dev and prod).
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Extraction/LLM calls can be slow — give them room.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
